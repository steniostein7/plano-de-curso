<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos de Curso 2º Tri - Ensino Médio | Professor MG</title>
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #6B3B6F; 
            --secondary: #FF8A65; 
            --bg: #f4f7f6; 
            --text: #333;
            --trimestre-color: #2e7d32; /* Padrão Verde do 2º Trimestre */
        }

        * { scroll-behavior: smooth; box-sizing: border-box; }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; 
            min-height: 100vh; 
        }

        .container { max-width: 700px; margin: 0 auto; flex: 1; width: 100%; }

        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.85rem; color: #666; }
        .breadcrumb a { color: var(--primary); text-decoration: none; }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
        
        .badge-2tri {
            display: inline-block;
            background: var(--trimestre-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .search-box { margin-bottom: 20px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 0.9rem;
        }
        .search-box i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #999; }

        .tabs-anos { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { 
            padding: 12px 24px; 
            border: 2px solid var(--primary); 
            background: white; 
            color: var(--primary); 
            cursor: pointer; 
            border-radius: 25px; 
            font-weight: 600; 
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(107, 59, 111, 0.3); }

        .content-ano { display: none; grid-template-columns: 1fr; gap: 12px; animation: fadeIn 0.4s ease; }
        .content-ano.active { display: grid; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: white; padding: 15px; border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            display: flex; align-items: center; justify-content: space-between; 
            border-left: 5px solid var(--trimestre-color);
            transition: 0.3s;
        }
        .card:hover { transform: translateX(5px); }

        .card-info { flex: 1; display: flex; align-items: center; gap: 12px; }
        .card-icon { font-size: 1.5rem; color: var(--primary); min-width: 30px; text-align: center; }
        .card-title { font-weight: 600; font-size: 0.85rem; color: #333; text-transform: uppercase; }

        .btn-dl { 
            background: var(--primary); color: white; text-decoration: none; 
            padding: 10px 18px; border-radius: 8px; 
            font-size: 0.75rem; font-weight: 600; 
            display: inline-flex; align-items: center; gap: 6px;
        }

        .btn-voltar { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }

        footer { margin-top: 50px; padding: 30px 20px; font-size: 0.8rem; color: #888; text-align: center; border-top: 1px solid #eee; }
        .social-links { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; }
        .social-btn { color: var(--primary); font-size: 1.2rem; text-decoration: none; }

        @media (max-width: 600px) {
            .tab-btn { padding: 10px 18px; font-size: 0.85rem; }
            .card-title { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="breadcrumb">
        <a href="index.html"><i class="fas fa-home"></i> Início</a>
        <i class="fas fa-chevron-right"></i>
        <span>Ensino Médio - 2º Tri</span>
    </nav>

    <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
    
    <header>
        <div class="badge-2tri">2º Trimestre 2026</div>
        <h1>📕 Ensino Médio</h1>
        <p>Planos de Curso - 1º ao 3º Ano</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar disciplina..." onkeyup="filterCards()">
        <i class="fas fa-search"></i>
    </div>

    <div class="tabs-anos" role="tablist">
        <button class="tab-btn active" onclick="openAno(event, '1ano')">1º Ano</button>
        <button class="tab-btn" onclick="openAno(event, '2ano')">2º Ano</button>
        <button class="tab-btn" onclick="openAno(event, '3ano')">3º Ano</button>
    </div>

    <div id="1ano" class="content-ano active">
        <div class="card">
            <div class="card-info">
                <i class="fas fa-book card-icon"></i>
                <span class="card-title">Língua Portuguesa - 1º ano</span>
            </div>
            <a href="LINK_DO_DRIVE_AQUI" class="btn-dl">
                <i class="fas fa-download"></i> Download
            </a>
        </div>
        </div>

    <div id="2ano" class="content-ano"></div>
    <div id="3ano" class="content-ano"></div>

    <footer>
        <div class="social-links">
            <a href="https://tiktok.com/@steniostein7" target="_blank" class="social-btn"><i class="fab fa-tiktok"></i></a>
            <a href="https://instagram.com/steniostein7" target="_blank" class="social-btn"><i class="fab fa-instagram"></i></a>
            <a href="mailto:steniostein7@gmail.com" class="social-btn"><i class="fas fa-envelope"></i></a>
        </div>
        <p>&copy; 2026 Professor MG | Tecbox Academy</p>
    </footer>
</div>

<script>
    // Converte links do Drive para Download Direto
    function convertLinks() {
        document.querySelectorAll('.btn-dl').forEach(btn => {
            let url = btn.getAttribute('href');
            if (url && url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([^\/]+)/);
                if (match && match[1]) {
                    btn.setAttribute('href', `https://drive.google.com/uc?export=download&id=${match[1]}`);
                }
            }
        });
    }

    function openAno(evt, anoName) {
        var i, content, tabs;
        content = document.getElementsByClassName("content-ano");
        for (i = 0; i < content.length; i++) { content[i].classList.remove("active"); }
        tabs = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove("active");
            tabs[i].setAttribute("aria-selected", "false");
        }
        document.getElementById(anoName).classList.add("active");
        if (evt) {
            evt.currentTarget.classList.add("active");
            evt.currentTarget.setAttribute("aria-selected", "true");
        }
        document.getElementById("searchInput").value = "";
        filterCards();
    }
    
    function filterCards() {
        var input = document.getElementById("searchInput");
        var filter = input.value.toLowerCase();
        var activeContent = document.querySelector(".content-ano.active");
        if (!activeContent) return;
        var cards = activeContent.getElementsByClassName("card");
        for (var i = 0; i < cards.length; i++) {
            var title = cards[i].getElementsByClassName("card-title")[0];
            cards[i].style.display = title.innerText.toLowerCase().indexOf(filter) > -1 ? "flex" : "none";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        convertLinks();
        var hash = window.location.hash.replace('#', '').toLowerCase();
        var mapHash = {"1em": "1ano", "2em": "2ano", "3em": "3ano"};
        if (mapHash[hash]) openAno(null, mapHash[hash]);
    });
</script>
</body>
</html>
